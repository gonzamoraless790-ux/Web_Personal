<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VS Code Git Warning</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="terminal-sheen" aria-hidden="true">
      <div class="line"><span>0%</span> <span>0</span> <span>0</span> <span>#</span></div>
      <div class="line"><span>0%</span> <span>0</span> <span>#</span> <span>#!</span></div>
    </div>

    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
      <div class="titlebar">
        <span id="dialog-title">Visual Studio Code</span>
        <button class="close-button" aria-label="Close">×</button>
      </div>

      <div class="dialog-body">
        <div class="warning-icon" aria-hidden="true">
          <span></span>
        </div>

        <p>
          Make sure you configure your <strong>"user.name"</strong> and
          <strong>"user.email"</strong> in git.
        </p>
      </div>

      <div class="actions">
        <button class="primary">Open Git Log</button>
        <button>Learn More</button>
        <button>Cancel</button>
      </div>
    </div>
  </body>
</html>
